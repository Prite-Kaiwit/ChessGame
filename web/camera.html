<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChessGame · กล้อง</title>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/board">ChessGame</a>
    <nav class="nav">
      <a href="/board">Board</a>
      <a href="/camera" aria-current="page">Camera</a>
    </nav>
    <div class="topbar-end">
      <div class="theme-toggle" role="group" aria-label="ธีม">
        <button type="button" data-theme-value="light">Light</button>
        <button type="button" data-theme-value="dark">Dark</button>
      </div>
    </div>
  </header>

  <main class="narrow-page">
    <section class="panel">
      <div class="panel-head">
        <h1>กล้องกระดาน</h1>
        <span id="connection-status" class="pill">ยังไม่เชื่อมต่อ</span>
      </div>
      <div class="video-frame">
        <video id="camera-video" autoplay playsinline muted></video>
        <div id="video-placeholder" class="video-placeholder">กดเริ่มเพื่อเปิดกล้อง</div>
      </div>
      <div class="controls">
        <button id="start-camera" type="button" class="button button-primary">เริ่มส่งภาพ</button>
        <button id="stop-camera" type="button" class="button" disabled>หยุด</button>
        <span class="metric">ส่งได้ <strong id="fps-value">0</strong> fps · ข้าม <strong id="skipped-value">0</strong></span>
      </div>
      <div class="panel-body help-text">
        <p class="muted" id="fps-label">fps เป้าหมาย</p>
        <div class="segmented" role="radiogroup" aria-labelledby="fps-label">
          <label><input type="radio" name="fps" value="5"><span>5</span></label>
          <label><input type="radio" name="fps" value="10"><span>10</span></label>
          <label><input type="radio" name="fps" value="15"><span>15</span></label>
          <label><input type="radio" name="fps" value="20"><span>20</span></label>
          <label><input type="radio" name="fps" value="30"><span>30</span></label>
        </div>
        <p class="muted lens-label" id="lens-label">เลนส์กล้อง</p>
        <select id="lens-select" class="lens-select" aria-labelledby="lens-label" disabled>
          <option value="">กล้องหลัง (ค่าเริ่มต้น)</option>
        </select>
        <p class="muted lens-label" id="zoom-label">ซูม <strong id="zoom-value">1.0x</strong> <span id="zoom-mode"></span></p>
        <input id="zoom-range" class="zoom-range" type="range" min="1" max="3" step="0.1" value="1"
               aria-labelledby="zoom-label" disabled>
        <p class="note">
          ภาพ JPEG กว้าง 640px · ถ้า "ข้าม" ขึ้นบ่อย แปลว่าเน็ตส่งไม่ทัน ระบบจะข้ามเฟรมเองเพื่อไม่ให้ภาพหน่วง
          ลองลด fps ลง · วางมือถือให้เห็นกระดานครบทั้ง 4 มุม
        </p>
        <p id="camera-error" class="error-message" role="status"></p>
      </div>
    </section>
  </main>
  <script src="/static/js/camera.js"></script>
</body>
</html>
